<!DOCTYPE html>
<html>
<head>
  <title>Button Calculator</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
    }

    #display {
      width: 200px;
      height: 40px;
      font-size: 20px;
      margin-bottom: 10px;
      text-align: right;
      padding: 5px;
    }

    button {
      width: 45px;
      height: 45px;
      font-size: 18px;
      margin: 3px;
      cursor: pointer;
    }
  </style>
  <script src="./Nameste-DSA/test.js" defer></script>
</head>
<body>

  <!-- <h2>Calculator</h2>

  <input type="text" id="display" disabled>

  <br> -->

  <!-- Numbers -->
  <button id="drp" onclick="press('7')">7</button>
  <button id="drp" onclick="press('8')">8</button>
  <button id="drp" onclick="press('9')">9</button>
  <button id="drp" onclick="press('/')">/</button><br>

  <button id="drp" onclick="press('4')">4</button>
  <button onclick="press('5')">5</button>
  <button onclick="press('6')">6</button>
  <button onclick="press('*')">*</button><br>

  <button onclick="press('1')">1</button>
  <button onclick="press('2')">2</button>
  <button onclick="press('3')">3</button>
  <button onclick="press('-')">-</button><br>

  <button onclick="press('0')">0</button>
  <button onclick="press('.')">.</button>
  <button onclick="calculate()">=</button>
  <button onclick="press('+')">+</button><br>

  <button onclick="clearDisplay()">C</button>

</html>
